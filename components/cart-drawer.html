  <!-- ==============================================================
       CART DRAWER
       ============================================================== -->
  <div class="mc-cart-overlay" id="mc-cart-overlay"></div>
  <div class="mc-cart-drawer" id="mc-cart-drawer">
    <div class="mc-cart-header">
      <h2 class="mc-cart-title">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="9" cy="21" r="1" />
          <circle cx="20" cy="21" r="1" />
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
        </svg>
        Your Cart (<span class="mc-cart-count-badge">0</span>)
      </h2>
      <button class="mc-cart-close" id="mc-close-cart" aria-label="Close Cart">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M18 6L6 18M6 6l12 12" />
        </svg>
      </button>
    </div>
    <!-- Free Shipping Progress Bar -->
    <div class="mc-shipping-bar">
      <div class="mc-shipping-bar-track">
        <div class="mc-shipping-bar-fill" id="mc-shipping-progress-fill"></div>
      </div>
      <p class="mc-shipping-bar-text" id="mc-shipping-bar-text">Add <span>₹4,999</span> more for <strong>FREE shipping</strong></p>
    </div>
    <div class="mc-cart-items" id="mc-cart-items"></div>
    <div class="mc-cart-footer">
      <div class="mc-cart-subtotal"><span>Subtotal</span><span id="mc-cart-subtotal-val">&#8377;0</span></div>
      <button class="mc-btn mc-btn-accent mc-cart-checkout-btn" onclick="alert('Proceeding to checkout!')">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Proceed to Checkout
      </button>
    </div>
  </div>
